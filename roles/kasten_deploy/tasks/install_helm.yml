---
- name: Helm | Build the merged values
  ansible.builtin.import_tasks: values.yml

- name: Helm | Read the chart metadata from the local chart
  ansible.builtin.command: helm show chart {{ kasten_helm_chart_path | quote }}
  delegate_to: localhost
  become: false
  register: kasten_deploy_chart_metadata
  changed_when: false

- name: Helm | Check that the chart version matches kasten_version
  ansible.builtin.assert:
    that: (kasten_deploy_chart_metadata.stdout | from_yaml).version == kasten_version
    fail_msg: >-
      The chart at {{ kasten_helm_chart_path }} is version {{ (kasten_deploy_chart_metadata.stdout | from_yaml).version }},
      kasten_version is {{ kasten_version }}.
    quiet: true

- name: Helm | Install or upgrade the release from the local chart
  kubernetes.core.helm:
    name: "{{ kasten_release_name }}"
    chart_ref: "{{ kasten_helm_chart_path }}"
    release_namespace: "{{ kasten_namespace }}"
    create_namespace: true
    values: "{{ kasten_deploy_values }}"
    wait: true
    wait_timeout: "{{ kasten_helm_wait_timeout }}"
    kubeconfig: "{{ kasten_kubeconfig | default(omit, true) }}"
    context: "{{ kasten_kube_context | default(omit, true) }}"
  register: kasten_deploy_helm_release
  no_log: "{{ kasten_docker_config_json_b64 | length > 0 }}"

- name: Helm | Wait for the Deployments of the Kasten namespace to be Available
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ kasten_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 600
  register: kasten_deploy_deployments
  changed_when: false

- name: Helm | Wait for the Kasten configuration CRDs
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
  register: kasten_deploy_crd
  until: kasten_deploy_crd.resources | length > 0
  retries: 30
  delay: 10
  changed_when: false
  loop:
    - policies.config.kio.kasten.io
    - profiles.config.kio.kasten.io
